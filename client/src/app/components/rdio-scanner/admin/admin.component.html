<ng-container *ngIf="!authenticated">
    <rdio-scanner-admin-login data-rdio="admin-login"></rdio-scanner-admin-login>
</ng-container>
<ng-container *ngIf="authenticated">
    <rdio-scanner-admin-todos></rdio-scanner-admin-todos>
    <mat-accordion displayMode="flat" data-rdio="admin">
        <mat-expansion-panel data-rdio="admin-stats" (afterExpand)="statsComponent.refresh()">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <mat-icon>analytics</mat-icon>
                    Statistics
                </mat-panel-title>
            </mat-expansion-panel-header>
            <rdio-scanner-admin-stats #statsComponent></rdio-scanner-admin-stats>
        </mat-expansion-panel>
        <mat-expansion-panel #configPanel data-rdio="admin-config" (afterCollapse)="configComponent?.closeAll()">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <mat-icon>settings</mat-icon>
                    Config
                </mat-panel-title>
            </mat-expansion-panel-header>
            <rdio-scanner-admin-config #configComponent></rdio-scanner-admin-config>
        </mat-expansion-panel>
        <mat-expansion-panel data-rdio="admin-plugins" (afterExpand)="pluginsComponent.load()">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <mat-icon>extension</mat-icon>
                    Plugins
                </mat-panel-title>
            </mat-expansion-panel-header>
            <rdio-scanner-admin-plugins #pluginsComponent></rdio-scanner-admin-plugins>
        </mat-expansion-panel>
        <mat-expansion-panel data-rdio="admin-logs" (afterExpand)="logsComponent.reload()">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <mat-icon>article</mat-icon>
                    Logs
                </mat-panel-title>
            </mat-expansion-panel-header>
            <rdio-scanner-admin-logs #logsComponent></rdio-scanner-admin-logs>
        </mat-expansion-panel>
        <mat-expansion-panel data-rdio="admin-tools" (afterCollapse)="toolsComponent?.closeAll()">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <mat-icon>build</mat-icon>
                    Tools
                </mat-panel-title>
            </mat-expansion-panel-header>
            <rdio-scanner-admin-tools #toolsComponent (config)="configComponent.reset($event, { dirty: true }); configPanel.open()"></rdio-scanner-admin-tools>
        </mat-expansion-panel>
        <!-- Plugins add their own sections here. Placed before Logout so a
             plugin panel never appears below it, which would read as being part
             of logging out. -->
        <rdio-plugin-slot name="admin-panel"></rdio-plugin-slot>
        <mat-expansion-panel data-rdio="admin-logout" hideToggle (click)="logout()">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <mat-icon>logout</mat-icon>
                    Logout
                </mat-panel-title>
            </mat-expansion-panel-header>
        </mat-expansion-panel>
    </mat-accordion>
</ng-container>
