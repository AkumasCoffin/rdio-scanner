<!--
    data-rdio attributes are stable anchor points for plugins — see
    server/plugin_anchors_test.go. The tab shell keeps every anchor the old
    accordion published.
-->
<ng-container *ngIf="!authenticated">
    <rdio-scanner-admin-login data-rdio="admin-login"></rdio-scanner-admin-login>
</ng-container>
<ng-container *ngIf="authenticated">
    <div class="admin-shell" data-rdio="admin">
        <header class="admin-header">
            <span class="admin-title">Rdio Scanner Admin</span>
            <span class="admin-spacer"></span>
            <span class="admin-dirty" *ngIf="configComponent?.form?.dirty">unsaved changes</span>
            <button type="button" mat-button [disabled]="!configComponent?.form || configComponent?.form?.disabled || configComponent?.form?.pristine"
                (click)="configComponent?.reset()">Reset</button>
            <button type="button" mat-raised-button color="primary"
                [disabled]="!configComponent?.form || configComponent?.form?.disabled || configComponent?.form?.pristine || configComponent?.form?.invalid"
                (click)="configComponent?.save()">Save</button>
            <button type="button" mat-button data-rdio="admin-logout" (click)="logout()">
                <mat-icon>logout</mat-icon>
                Logout
            </button>
        </header>

        <rdio-scanner-admin-todos></rdio-scanner-admin-todos>

        <nav class="admin-tabs">
            <button *ngFor="let tab of visibleTabs" type="button" class="admin-tab"
                [class.active]="activeTab === tab.id" (click)="select(tab.id)">
                <mat-icon>{{ tab.icon }}</mat-icon>
                {{ tab.label }}
                <mat-icon class="warn" *ngIf="tabInvalid(tab.id)" color="warn">error</mat-icon>
            </button>
        </nav>

        <main class="admin-content">
            <section *ngIf="activeTab === 'dashboard'" data-rdio="admin-stats">
                <div class="dash-cards">
                    <button type="button" class="dash-card" (click)="select('systems')">
                        <span class="num">{{ systemsCount }}</span>
                        <span class="lbl">Systems</span>
                    </button>
                    <button type="button" class="dash-card" (click)="select('plugins')">
                        <mat-icon>extension</mat-icon>
                        <span class="lbl">Plugins</span>
                    </button>
                    <button type="button" class="dash-card" (click)="select('logs')">
                        <mat-icon>article</mat-icon>
                        <span class="lbl">Logs</span>
                    </button>
                    <button type="button" class="dash-card" (click)="select('tools')">
                        <mat-icon>build</mat-icon>
                        <span class="lbl">Tools</span>
                    </button>
                </div>
                <rdio-scanner-admin-stats #statsComponent></rdio-scanner-admin-stats>
            </section>

            <!-- One always-alive config host: the reactive form (and any
                 unsaved edits) survives switching between config tabs. Hidden
                 rather than destroyed when a non-config tab is active. -->
            <section [hidden]="!isConfigTab" data-rdio="admin-config">
                <rdio-scanner-admin-config #configComponent [section]="configSection"></rdio-scanner-admin-config>
            </section>

            <section *ngIf="activeTab === 'plugins'" data-rdio="admin-plugins">
                <rdio-scanner-admin-plugins #pluginsComponent></rdio-scanner-admin-plugins>
                <!-- Plugin-provided admin panels live with the plugin manager. -->
                <rdio-plugin-slot name="admin-panel"></rdio-plugin-slot>
            </section>

            <section *ngIf="activeTab === 'logs'" data-rdio="admin-logs">
                <rdio-scanner-admin-logs #logsComponent></rdio-scanner-admin-logs>
            </section>

            <section *ngIf="activeTab === 'tools'" data-rdio="admin-tools">
                <rdio-scanner-admin-tools #toolsComponent
                    (config)="configComponent?.reset($event, { dirty: true }); select('systems')"></rdio-scanner-admin-tools>
            </section>
        </main>
    </div>
</ng-container>
